[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stegohunter"
version = "0.3.0"
description = "Detect and extract hidden data from images and audio (LSB, RS/SPA, palette, appended-data, JPEG DCT, visual heatmaps, audio spectrograms, triage, cracking, web lab)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "StegoHunter" }]
keywords = ["steganography", "steganalysis", "security", "ctf", "osint", "forensics"]
dependencies = [
    "Pillow>=9.0",
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
stegohunter = "stegohunter.cli:main"

[tool.setuptools.packages.find]
include = ["stegohunter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
